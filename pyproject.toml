[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "professional-profile-search"
version = "0.1.0"
description = "Local-LLM profile search with validated, sourced candidates"
requires-python = ">=3.10"
dependencies = [
    "ddgs>=9.0",
    "langchain>=1.0",
    "langchain-core>=1.0",
    "langchain-ollama>=1.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "streamlit>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
py-modules = [
    "config",
    "keyword_extractor",
    "linkedin_search",
    "main",
    "profile_search",
    "profile_validation",
    "query_builder",
    "schemas",
    "streamlit_app",
    "workflow",
]

[tool.pytest.ini_options]
testpaths = ["test_query_builder.py", "test_profile_search.py"]